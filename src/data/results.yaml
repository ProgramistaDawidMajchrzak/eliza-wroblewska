# ─────────────────────────────────────────────────────────────
#  WYNIKI – pełna oś czasu
#
#  Jak dodać nowy wynik: skopiuj jeden blok (od „- date” do następnego „- date”),
#  wklej go NA GÓRZE listy i zmień wartości. Kolejność na stronie ustawia się sama (po dacie).
#
#  date:      "RRRR-MM-DD", albo "RRRR-MM" (znany tylko miesiąc), albo "RRRR" (znany tylko rok)
#  name:      nazwa zawodów po polsku (pl) i angielsku (en)
#  city:      miasto (opcjonalnie) – pojawia się na tablicy miast na stronie /wspolpraca
#  result:    gold | silver | bronze | liczba (miejsce, np. 5) | start (sam udział)
#  category:  kategoria wagowa (opcjonalnie, np. "-78 kg")
#  international: false  → zawody krajowe (domyślnie: międzynarodowe)
#  featured:  true → wynik trafia do 6 wyróżnionych kart w sekcji „Osiągnięcia”
#             (pilnuj, żeby takich wyników było dokładnie 6)
#  rise:      true → wynik trafia do sekcji „Na fali” (historia w kategorii -78 kg)
# ─────────────────────────────────────────────────────────────

