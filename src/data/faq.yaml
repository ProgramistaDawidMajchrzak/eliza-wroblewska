      pl: "TODO: minimalny okres współpracy (np. sezon startowy)."
      en: "TODO: minimum partnership term (e.g. one competition season)."

  - q:
      pl: "Czy mała firma może zostać partnerem?"
      en: "Can a small business become a partner?"
    a:
      pl: "Tak. Pakiet Partner Lokalny jest pomyślany dla małych i średnich firm z Poznania i Wielkopolski."
      en: "Yes. The Local Partner package is designed for small and medium-sized businesses from Poznań and Greater Poland."

  - q:
      pl: "Jak rozliczyć sponsoring podatkowo?"
      en: "How is sponsorship treated for tax purposes?"
    a:
      pl: "Firmy finansujące niezarobkowy klub sportowy lub stypendium sportowe mogą skorzystać z ulgi sponsoringowej i rozliczyć łącznie 150% wydatku. Szczegóły opisujemy wyżej – formę umowy trzeba potwierdzić z księgowym."
      en: "Companies funding a non-profit sports club or a sports scholarship can use the Polish sponsorship relief and account for 150% of the expense in total. See the details above – the form of agreement must be confirmed with your accountant."

