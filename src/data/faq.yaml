faq:
  - q:
      pl: "Czy logo pojawi się na judodze podczas zawodów?"
      en: "Will our logo appear on the judogi at competitions?"
    a:
      pl: "Tego nie obiecujemy. Na zawodach IJF reklama na judodze podlega ścisłym przepisom federacji. Dlatego ekspozycję marki budujemy na odzieży treningowej, dresie i torbie, na stronie oraz w social mediach."
      en: "We don't promise that. Advertising on the judogi at IJF events is strictly regulated by the federation, so we build your brand's exposure on training wear, the tracksuit and kit bag, on the website and on social media."

  - q:
      pl: "Czy Eliza może przyjechać do naszej firmy?"
      en: "Can Eliza come to our company?"
    a:
      pl: "Tak. Wystąpienia są częścią pakietów Partner Główny i Partner: wykład dla zespołu, event firmowy albo trening judo dla pracowników lub ich dzieci. Terminy ustalamy tak, żeby nie kolidowały z kalendarzem startów."
      en: "Yes. Appearances are part of the Main Partner and Partner packages: a talk for your team, a company event or a judo session for employees or their children. Dates are planned around the competition calendar."

  - q:
      pl: "Jak wygląda umowa?"
      en: "What does the agreement look like?"
    a:
      pl: "Umowę przygotowujemy indywidualnie. Może być zawarta z zawodniczką albo przez klub – to drugie rozwiązanie może pozwolić skorzystać z ulgi sponsoringowej. TODO: potwierdzić dostępne formy umowy."
      en: "Each agreement is prepared individually. It can be signed with the athlete or through the club – the latter may allow you to use the Polish sponsorship tax relief. TODO: confirm the available forms of agreement."

